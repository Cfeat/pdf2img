<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF2Img · PDF 转图片</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600;650;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="brand">
        <div class="brand-mark">P2</div>
        <div>
          <h1>PDF2Img</h1>
          <p>PDF 转 PNG / JPG，并可控制每页输出体积</p>
        </div>
      </header>

      <div class="layout">
        <section class="panel">
          <div class="panel-inner">
            <div class="dropzone" id="dropzone">
              <input type="file" id="file" accept="application/pdf,.pdf" />
              <div>
                <strong>拖拽 PDF 到此处，或点击选择</strong>
                <span>支持多页文档 · 本地处理，文件不上传公网</span>
              </div>
            </div>
            <div class="file-chip" id="fileChip">
              <span id="fileName">—</span>
              <span class="meta" id="fileMeta"></span>
            </div>

            <div class="grid-form">
              <label class="field">
                <span>输出格式</span>
                <select id="fmt">
                  <option value="png">PNG</option>
                  <option value="jpg" selected>JPG</option>
                  <option value="jpeg">JPEG</option>
                </select>
              </label>

              <label class="field">
                <span>分辨率 DPI</span>
                <input type="number" id="dpi" value="150" min="36" max="600" step="1" />
              </label>

              <label class="field full">
                <span>页码范围</span>
                <input type="text" id="pages" placeholder="留空=全部，例：1,3,5-8" />
                <span class="hint">按 1 起始页码；区间用连字符</span>
              </label>

              <div class="full toggle-row">
                <div>
                  <strong>限制每页文件大小</strong>
                  <span class="hint">开启后按目标体积自动压缩 / 缩放</span>
                </div>
                <label class="switch">
                  <input type="checkbox" id="sizeEnabled" />
                  <span class="slider"></span>
                </label>
              </div>

              <label class="field" id="targetField">
                <span>目标大小（KB / 页）</span>
                <input type="number" id="targetKb" value="200" min="10" max="20480" step="1" disabled />
              </label>

              <label class="field" id="qualityField">
                <span>JPEG 质量</span>
                <input type="number" id="quality" value="85" min="1" max="95" step="1" />
                <span class="hint">未限制大小时生效；PNG 可忽略</span>
              </label>
            </div>

            <div class="actions">
              <button class="btn-primary" id="btnConvert" disabled>转换并下载 ZIP</button>
              <button class="btn-ghost" id="btnEstimate" disabled>估算体积</button>
            </div>
            <div class="progress" id="progress"><i></i></div>
            <div class="status" id="status">请先选择 PDF 文件</div>
            <div class="result-list" id="results"></div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-inner">
            <div class="preview-head">
              <h2>页面预览</h2>
              <div class="pager">
                <button type="button" id="prevPage" disabled aria-label="上一页">‹</button>
                <span id="pageLabel">— / —</span>
                <button type="button" id="nextPage" disabled aria-label="下一页">›</button>
              </div>
            </div>
            <div class="preview-frame" id="previewFrame">
              <div class="placeholder" id="previewPlaceholder">上传 PDF 后在此预览</div>
              <img id="previewImg" alt="PDF 预览" hidden />
            </div>
          </div>
        </section>
      </div>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
